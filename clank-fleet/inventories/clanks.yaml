    notes: >-
      Developed primarily on the owner's Windows PC, not this Mac -- the
      GitHub/Hetzner state is authoritative, not any single local checkout.
      Honor + TCL sources are production-allowlisted (2026-08-17) after a
      completed 12-cycle soak; Apple US/IN and Samsung remain experimental.
      No native macOS client exists or is planned yet -- do not build one
      without first establishing engine truth on the target machine.

