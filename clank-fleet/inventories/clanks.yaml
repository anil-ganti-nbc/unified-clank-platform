# Authoritative Clank fleet manifest.
#
# This is the fleet's source of truth for STABLE identity — not live state.
# Do not hand-maintain HEAD SHAs, health, or deployment revisions here: those
# are discovered at query time by scripts/reconcile_fleet.py against GitHub,
# this Mac, Hetzner, and the NAS. Editing this file to "fix" a reconciliation
# mismatch is almost always wrong — fix the actual environment instead.
#
# Compiled from OPERATION CLANK CENSUS + UNDUCK (2026-08-18): independent
# cross-referencing of local Mac checkouts, GitHub repos, Hetzner deploy
# targets, and NAS state. See that session's report for full provenance.
#
# state_class:
#   production   — has at least one source/component with editorial/delivery
#                  authority in a real deployment target
#   experimental — deployed and running, but not yet notification-authoritative
#                  anywhere, or explicitly soak-only
#   deferred     — real engine exists, intentionally not yet deployed anywhere
#   deprecated   — superseded or abandoned; kept here only so it is never
#                  mistaken for a missing/undiscovered Clank
#
# lifecycle_maturity is a coarse human summary, not the per-source collector
# lifecycle (DISCOVERED -> ... -> PRODUCTION) defined in docs/SOURCE_EXPANSION_LIFECYCLE.md,
# which applies within a single Clank's source roster, not to the Clank as a whole.

clanks:
  - clank_id: watch-clank
    display_name: Watch Clank
    primary_purpose: >-
      Watch/horology news and product intelligence across many first-party
      and specialist sources (Casio, Citizen, Seiko, Timex, WatchTime, etc.),
      with active Discord delivery.
    project_type: collector-and-editorial
    repository_url: https://github.com/anil-ganti-nbc/watch-clank
    expected_local_directory: watch-clank
    native_client_support: true
    expected_deployment_targets: [hetzner, mac-field-test]
    state_class: production
    lifecycle_maturity: mature-production

  - clank_id: smartphone-clank
